<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>" />
<title>NEON SNAKE · 네온 스네이크</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 760px at 12% -8%, rgba(139, 92, 246, .22), transparent 62%),
      radial-gradient(900px 700px at 108% 12%, rgba(34, 211, 238, .16), transparent 58%),
      #070b14;
    color: #e2e8f0;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
  }
  body::before {
    width: 52vmax; height: 52vmax;
    left: -18vmax; top: -20vmax;
    background: radial-gradient(circle, rgba(139, 92, 246, .5), transparent 65%);
    animation: drift-a 16s ease-in-out infinite alternate;
  }
  body::after {
    width: 46vmax; height: 46vmax;
    right: -16vmax; bottom: -18vmax;
    background: radial-gradient(circle, rgba(34, 211, 238, .35), transparent 65%);
    animation: drift-b 20s ease-in-out infinite alternate;
  }
  @keyframes drift-a { to { transform: translate3d(5vmax, 4vmax, 0) scale(1.08); } }
  @keyframes drift-b { to { transform: translate3d(-5vmax, -4vmax, 0) scale(1.12); } }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 8vw, 40px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: .04em;
    filter: drop-shadow(0 0 22px rgba(34, 211, 238, .25));
  }
  h1 .grad {
    background: linear-gradient(92deg, #a3e635 0%, #22d3ee 60%, #8b5cf6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tag {
    margin: 7px 0 0;
    font-size: 11px;
    letter-spacing: .22em;
    color: #94a3b8;
    font-weight: 600;
  }
  .tools { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 14px;
    border: 1px solid rgba(148, 163, 184, .2);
    background: rgba(255, 255, 255, .05);
    color: #e2e8f0;
    font-size: 17px;
    cursor: pointer;
    transition: background .15s ease, opacity .15s ease, transform .15s ease;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .icon-btn:hover:not(:disabled) { background: rgba(255, 255, 255, .1); }
  .icon-btn:active:not(:disabled) { transform: scale(.94); }
  .icon-btn:disabled { opacity: .32; cursor: default; }
  .icon-btn.off { opacity: .55; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stat {
    min-width: 0;
    padding: 8px 12px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, .16);
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02));
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .stat .label {
    font-size: 10px;
    letter-spacing: .14em;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 600;
  }
  .stat strong {
    font-size: clamp(16px, 4.5vw, 20px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  #best {
    background: linear-gradient(92deg, #a3e635, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #combo { color: #94a3b8; }
  .combo.hot {
    border-color: rgba(244, 114, 182, .6);
    box-shadow: 0 0 18px rgba(244, 114, 182, .3), inset 0 0 14px rgba(244, 114, 182, .1);
  }
  .combo.hot #combo { color: #f472b6; }

  .stage {
    position: relative;
    width: min(520px, 94vw, 62vh);
    aspect-ratio: 1 / 1;
    margin-inline: auto;
    padding: 2px;
    border-radius: 26px;
    background: linear-gradient(150deg, rgba(163, 230, 53, .85), rgba(34, 211, 238, .5) 45%, rgba(139, 92, 246, .85));
    box-shadow:
      0 0 34px rgba(34, 211, 238, .16),
      0 26px 60px rgba(0, 0, 0, .6);
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    background: #070b14;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 2px;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 18px;
    overflow: auto;
    border-radius: 24px;
    background: rgba(6, 10, 18, .6);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }
  .overlay[hidden] { display: none; }

  .panel {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .panel.in { animation: pop .34s cubic-bezier(.2, 1.25, .35, 1); }
  @keyframes pop {
    from { opacity: 0; transform: scale(.9) translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .panel-emoji {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 18px rgba(163, 230, 53, .45));
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: clamp(22px, 6vw, 29px);
    font-weight: 900;
    letter-spacing: .02em;
  }
  .panel h2 .grad {
    background: linear-gradient(92deg, #a3e635, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .panel p {
    margin: 0 0 18px;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.6;
  }
  .panel p b { color: #e2e8f0; }
  .panel .small {
    margin: 12px 0 0;
    font-size: 11px;
    color: rgba(148, 163, 184, .75);
  }
  .panel .new-record {
    margin: -4px 0 16px;
    color: #a3e635;
    font-weight: 800;
    font-size: 15px;
    text-shadow: 0 0 16px rgba(163, 230, 53, .5);
  }
  .btn {
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .03em;
    color: #07110a;
    padding: 13px 30px;
    border-radius: 999px;
    background: linear-gradient(100deg, #a3e635, #22d3ee);
    box-shadow:
      0 10px 26px rgba(34, 211, 238, .28),
      inset 0 1px 0 rgba(255, 255, 255, .35);
    transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }

  .result {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0 0 16px;
  }
  .result div {
    min-width: 96px;
    padding: 8px 16px;
    border-radius: 14px;
    border: 1px solid rgba(148, 163, 184, .16);
    background: rgba(255, 255, 255, .05);
  }
  .result span {
    display: block;
    font-size: 10px;
    letter-spacing: .14em;
    color: #94a3b8;
    font-weight: 600;
  }
  .result b {
    font-size: 21px;
    font-variant-numeric: tabular-nums;
  }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: .02em;
  }

  .dpad {
    display: none;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    grid-template-areas:
      ". up ."
      "left down right";
    gap: 8px;
    justify-content: center;
    margin-top: 2px;
  }
  .dpad-btn {
    border-radius: 18px;
    border: 1px solid rgba(148, 163, 184, .22);
    background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03));
    color: #22d3ee;
    font-size: 18px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .dpad-btn:active {
    transform: scale(.94);
    background: rgba(34, 211, 238, .2);
    color: #fff;
  }
  .dpad-btn[data-dir="up"] { grid-area: up; }
  .dpad-btn[data-dir="left"] { grid-area: left; }
  .dpad-btn[data-dir="down"] { grid-area: down; }
  .dpad-btn[data-dir="right"] { grid-area: right; }

  @media (pointer: coarse), (hover: none) {
    .dpad { display: grid; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
  :focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>NEON <span class="grad">SNAKE</span></h1>
      <p class="tag">EAT · GROW · GLOW</p>
    </div>
    <div class="tools">
      <button id="muteBtn" class="icon-btn" type="button" aria-label="소리 끄기" title="소리 끄기">🔊</button>
      <button id="pauseBtn" class="icon-btn" type="button" aria-label="일시정지" title="일시정지" disabled>⏸️</button>
    </div>
  </header>

  <section class="stats" aria-label="점수">
    <div class="stat"><span class="label">점수</span><strong id="score">0</strong></div>
    <div class="stat"><span class="label">최고</span><strong id="best">0</strong></div>
    <div class="stat combo" id="comboStat"><span class="label">콤보</span><strong id="combo">x1</strong></div>
    <div class="stat"><span class="label">레벨</span><strong id="level">1</strong></div>
  </section>

  <section class="stage" id="stage">
    <canvas id="game" width="520" height="520" aria-label="네온 스네이크 게임 화면"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div class="panel" id="panel"></div>
    </div>
  </section>

  <p class="hint">방향키 / WASD · 스와이프로 조작 &nbsp;|&nbsp; Space 일시정지</p>

  <div class="dpad" aria-label="터치 조작">
    <button type="button" class="dpad-btn" data-dir="up" aria-label="위">▲</button>
    <button type="button" class="dpad-btn" data-dir="left" aria-label="왼쪽">◀</button>
    <button type="button" class="dpad-btn" data-dir="down" aria-label="아래">▼</button>
    <button type="button" class="dpad-btn" data-dir="right" aria-label="오른쪽">▶</button>
  </div>
</main>

<script>
(() => {
  'use strict';

  const COLS = 20;
  const ROWS = 20;
  const SIZE = 520;
  const CELL = SIZE / COLS;
  const MONSTER_SCORE_STEP = 100;
  const MAX_MONSTERS = 3;

  const FOODS = [
    { emoji: '🍩', color: '#f472b6' },
    { emoji: '🍕', color: '#fb923c' },
    { emoji: '🧋', color: '#a78bfa' },
    { emoji: '🍓', color: '#fb7185' },
    { emoji: '💎', color: '#22d3ee' },
    { emoji: '⭐', color: '#facc15' }
  ];
  const DIRS = {
    up: { x: 0, y: -1 },
    down: { x: 0, y: 1 },
    left: { x: -1, y: 0 },
    right: { x: 1, y: 0 }
  };
  const KEY_DIRS = {
    arrowup: 'up', arrowdown: 'down', arrowleft: 'left', arrowright: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right'
  };

  const STORE_BEST = 'neonSnake.best.v1';
  const STORE_MUTE = 'neonSnake.muted.v1';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const overlay = document.getElementById('overlay');
  const panel = document.getElementById('panel');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const comboEl = document.getElementById('combo');
  const comboStat = document.getElementById('comboStat');
  const levelEl = document.getElementById('level');
  const muteBtn = document.getElementById('muteBtn');
  const pauseBtn = document.getElementById('pauseBtn');

  let state = 'menu';
  let snake = [];
  let dir = { x: 1, y: 0 };
  let pendingDirs = [];
  let food = null;
  let monsters = [];
  let monsterMoveCounter = 0;
  let score = 0;
  let best = 0;
  let bestAtStart = 0;
  let combo = 0;
  let comboTimer = 0;
  let acc = 0;
  let lastFrame = performance.now();
  let particles = [];
  let floaters = [];
  let shake = 0;
  let flash = 0;
  let muted = false;
  let overTimeout = null;
  let audioCtx = null;
  let swipe = null;

  function readStore(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value === null ? fallback : value;
    } catch (err) {
      return fallback;
    }
  }

  function writeStore(key, value) {
    try { localStorage.setItem(key, value); } catch (err) { /* storage unavailable */ }
  }

  best = parseInt(readStore(STORE_BEST, '0'), 10);
  if (!Number.isFinite(best) || best < 0) best = 0;
  muted = readStore(STORE_MUTE, '0') === '1';

  function rgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
  }

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(SIZE * dpr);
    canvas.height = Math.round(SIZE * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function audio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, dur = 0.12, opts = {}) {
    if (muted) return;
    const ac = audio();
    if (!ac) return;
    const to = opts.to;
    const type = opts.type || 'triangle';
    const vol = opts.vol == null ? 0.08 : opts.vol;
    const delay = opts.delay || 0;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, to), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function vibrate(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (err) { /* ignore */ }
  }

  function getLevel() {
    return 1 + Math.floor(score / 60);
  }

  function tickMs() {
    return Math.max(72, 160 - (getLevel() - 1) * 12);
  }

  function updateHUD() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(best);
    comboEl.textContent = 'x' + Math.max(1, combo);
    comboStat.classList.toggle('hot', combo >= 2);
    levelEl.textContent = String(getLevel());
  }

  function updateControls() {
    pauseBtn.textContent = state === 'paused' ? '▶️' : '⏸️';
    pauseBtn.setAttribute('aria-label', state === 'paused' ? '계속하기' : '일시정지');
    pauseBtn.setAttribute('title', state === 'paused' ? '계속하기' : '일시정지');
    pauseBtn.disabled = !(state === 'playing' || state === 'paused');
  }

  function updateMuteBtn() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
    const label = muted ? '소리 켜기' : '소리 끄기';
    muteBtn.setAttribute('aria-label', label);
    muteBtn.setAttribute('title', label);
    muteBtn.classList.toggle('off', muted);
  }

  function setPanel(html) {
    panel.innerHTML = html;
    panel.classList.remove('in');
    void panel.offsetWidth;
    panel.classList.add('in');
  }

  function showOverlay(kind, data) {
    const info = data || {};
    let html = '';

    if (kind === 'menu') {
      html = `
        <div class="panel-emoji">🐍</div>
        <h2>NEON <span class="grad">SNAKE</span></h2>
        <p>네온 사탕을 먹고 <b>콤보</b>를 터뜨려 봐!<br>100점부터 몬스터 등장! 부딪히면 한 칸 줄어드니 피해야 해.</p>
        <button class="btn" type="button" data-action="start">PLAY ▶</button>
        <p class="small">Space / Enter 로도 시작할 수 있어</p>`;
    } else if (kind === 'pause') {
      html = `
        <div class="panel-emoji">⏸️</div>
        <h2>잠깐 멈춤</h2>
        <p>숨 한 번 고르고 다시 달려!</p>
        <button class="btn" type="button" data-action="resume">계속하기 ▶</button>
        <p class="small">Space 로도 이어서 하기</p>`;
    } else if (kind === 'over') {
      html = `
        <div class="panel-emoji">💥</div>
        <h2>GAME <span class="grad">OVER</span></h2>
        <div class="result">
          <div><span>점수</span><b>${score}</b></div>
          <div><span>최고</span><b>${best}</b></div>
        </div>
        ${info.newRecord
          ? '<p class="new-record">🏆 신기록 달성!</p>'
          : `<p>레벨 ${getLevel()}까지 갔어. 한 번 더?</p>`}
        <button class="btn" type="button" data-action="start">다시 하기 ↻</button>
        <p class="small">Space / Enter 로도 다시 시작</p>`;
    } else if (kind === 'won') {
      html = `
        <div class="panel-emoji">🏆</div>
        <h2>PERFECT!</h2>
        <div class="result">
          <div><span>점수</span><b>${score}</b></div>
          <div><span>최고</span><b>${best}</b></div>
        </div>
        <p>보드를 전부 채웠어. 전설이다!</p>
        <button class="btn" type="button" data-action="start">한 번 더 ↻</button>`;
    }

    setPanel(html);
    overlay.hidden = false;
    updateControls();
  }

  function hideOverlay() {
    overlay.hidden = true;
  }

  function spawnFood() {
    const occupied = new Set([
      ...snake.map(n => n.y * COLS + n.x),
      ...monsters.map(monster => monster.y * COLS + monster.x)
    ]);
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(y * COLS + x)) free.push({ x, y });
      }
    }
    if (!free.length) {
      food = null;
      return false;
    }
    const spot = free[(Math.random() * free.length) | 0];
    const type = FOODS[(Math.random() * FOODS.length) | 0];
    food = { x: spot.x, y: spot.y, emoji: type.emoji, color: type.color };
    return true;
  }

  function spawnMonstersForScore() {
    const targetCount = Math.min(MAX_MONSTERS, Math.floor(score / MONSTER_SCORE_STEP));
    while (monsters.length < targetCount) {
      const occupied = new Set([
        ...snake.map(n => n.y * COLS + n.x),
        ...monsters.map(monster => monster.y * COLS + monster.x)
      ]);
      const free = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (!occupied.has(y * COLS + x) && (!food || food.x !== x || food.y !== y)) {
            free.push({ x, y });
          }
        }
      }
      if (!free.length) return;

      const head = snake[0];
      const distant = free.filter(cell => Math.abs(cell.x - head.x) + Math.abs(cell.y - head.y) >= 6);
      const choices = distant.length ? distant : free;
      const spot = choices[(Math.random() * choices.length) | 0];
      monsters.push(spot);
      floaters.push({
        x: (spot.x + 0.5) * CELL,
        y: (spot.y + 0.5) * CELL,
        text: 'MONSTER!',
        color: '#f472b6',
        life: 1.2,
        max: 1.2
      });
      tone(180, 0.2, { to: 320, type: 'sawtooth', vol: 0.07 });
    }
  }

  function moveMonsters() {
    const occupiedBySnake = new Set(snake.map(n => n.y * COLS + n.x));
    for (let i = 0; i < monsters.length; i++) {
      const monster = monsters[i];
      const occupiedByMonsters = new Set(
        monsters.filter((_, index) => index !== i).map(other => other.y * COLS + other.x)
      );
      const choices = Object.values(DIRS)
        .map(direction => ({ x: monster.x + direction.x, y: monster.y + direction.y }))
        .filter(cell =>
          cell.x >= 0 && cell.y >= 0 && cell.x < COLS && cell.y < ROWS &&
          !occupiedBySnake.has(cell.y * COLS + cell.x) &&
          !occupiedByMonsters.has(cell.y * COLS + cell.x) &&
          (!food || food.x !== cell.x || food.y !== cell.y)
        );
      if (choices.length) {
        const next = choices[(Math.random() * choices.length) | 0];
        monster.x = next.x;
        monster.y = next.y;
      }
    }
  }

  function shrinkSnakeOnHit() {
    if (snake.length <= 1) {
      die();
      return false;
    }
    snake.pop();
    const head = snake[0];
    const x = (head.x + 0.5) * CELL;
    const y = (head.y + 0.5) * CELL;
    burst(x, y, '#fb7185', 8, 150);
    floaters.push({ x, y: y - CELL * 0.3, text: '-1', color: '#fb7185', life: 0.75, max: 0.75 });
    shake = Math.max(shake, 8);
    tone(220, 0.16, { to: 90, type: 'sawtooth', vol: 0.08 });
    vibrate(18);
    return true;
  }

  function resetRun() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [];
    for (let i = 0; i < 4; i++) {
      snake.push({ x: cx - i, y: cy, px: cx - i, py: cy });
    }
    dir = { x: 1, y: 0 };
    pendingDirs = [];
    monsters = [];
    monsterMoveCounter = 0;
    score = 0;
    combo = 0;
    comboTimer = 0;
    acc = 0;
    particles = [];
    floaters = [];
    shake = 0;
    flash = 0;
    bestAtStart = best;
    spawnFood();
    updateHUD();
  }

  function startGame() {
    clearTimeout(overTimeout);
    resetRun();
    state = 'playing';
    lastFrame = performance.now();
    hideOverlay();
    updateControls();
    tone(523, 0.09, { vol: 0.07 });
    tone(784, 0.1, { delay: 0.09, vol: 0.07 });
    tone(1046, 0.12, { delay: 0.19, vol: 0.06 });
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    showOverlay('pause');
    tone(440, 0.08, { type: 'square', vol: 0.05 });
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    lastFrame = performance.now();
    hideOverlay();
    updateControls();
    tone(660, 0.08, { vol: 0.06 });
  }

  function togglePause() {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }

  function toggleMute() {
    muted = !muted;
    writeStore(STORE_MUTE, muted ? '1' : '0');
    updateMuteBtn();
    if (!muted) tone(880, 0.08, { vol: 0.06 });
  }

  function burst(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const s = speed * (0.3 + Math.random() * 1.1);
      const life = 0.45 + Math.random() * 0.5;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * s,
        vy: Math.sin(angle) * s - 30,
        life,
        max: life,
        size: 2 + Math.random() * 4,
        color
      });
    }
  }

  function levelUpFx() {
    floaters.push({
      x: SIZE / 2,
      y: SIZE / 2,
      text: 'SPEED UP ⚡',
      color: '#facc15',
      life: 1.1,
      max: 1.1
    });
    tone(784, 0.1, { vol: 0.07 });
    tone(988, 0.12, { delay: 0.09, vol: 0.06 });
    shake = Math.max(shake, 4);
  }

  function eat() {
    const px = (food.x + 0.5) * CELL;
    const py = (food.y + 0.5) * CELL;
    const color = food.color;
    const levelBefore = getLevel();

    combo = comboTimer > 0 ? Math.min(combo + 1, 9) : 1;
    comboTimer = 2600;
    const multi = Math.min(combo, 5);
    const gained = 10 * multi;
    score += gained;

    if (score > best) {
      best = score;
      writeStore(STORE_BEST, String(best));
    }

    burst(px, py, color, 16, 170);
    burst(px, py, '#ffffff', 6, 90);
    floaters.push({ x: px, y: py - CELL * 0.2, text: '+' + gained, color, life: 0.9, max: 0.9 });
    if (multi > 1) {
      floaters.push({
        x: px,
        y: py - CELL * 0.95,
        text: 'COMBO x' + multi,
        color: '#f472b6',
        life: 1.1,
        max: 1.1
      });
    }
    shake = Math.max(shake, 3.5);
    vibrate(12);

    if (combo >= 2 && comboStat.animate) {
      comboStat.animate(
        [{ transform: 'scale(1.16)' }, { transform: 'scale(1)' }],
        { duration: 220, easing: 'ease-out' }
      );
    }

    updateHUD();

    food = null;
    spawnMonstersForScore();
    const hasMore = spawnFood();

    const base = 520 + combo * 70;
    tone(base, 0.09, { vol: 0.08 });
    tone(base * 1.5, 0.12, { delay: 0.06, vol: 0.07 });

    if (getLevel() > levelBefore) levelUpFx();
    if (!hasMore) winGame();
  }

  function step() {
    if (pendingDirs.length) dir = pendingDirs.shift();

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      die();
      return;
    }

    if (monsters.some(monster => monster.x === nx && monster.y === ny)) {
      if (shrinkSnakeOnHit()) {
        moveMonsters();
        monsterMoveCounter = 0;
      }
      return;
    }

    const willGrow = !!food && nx === food.x && ny === food.y;
    const bodyLimit = willGrow ? snake.length : snake.length - 1;
    for (let i = 0; i < bodyLimit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        shrinkSnakeOnHit();
        return;
      }
    }

    snake.unshift({ x: nx, y: ny, px: head.x, py: head.y });
    if (!willGrow) snake.pop();
    if (willGrow) eat();
    if (state === 'playing' && monsters.length) {
      monsterMoveCounter++;
      if (monsterMoveCounter >= 3) {
        moveMonsters();
        monsterMoveCounter = 0;
      }
    }
  }

  function die() {
    state = 'over';
    shake = 18;
    flash = 1;

    snake.forEach((n, i) => {
      const x = (n.x + 0.5) * CELL;
      const y = (n.y + 0.5) * CELL;
      const color = i === 0 ? '#d9ff5c' : (i % 2 ? '#22d3ee' : '#a3e635');
      burst(x, y, color, 3, 120);
    });

    tone(300, 0.5, { to: 60, type: 'sawtooth', vol: 0.13 });
    tone(180, 0.6, { to: 40, type: 'square', vol: 0.08, delay: 0.06 });
    vibrate([20, 50, 40]);
    updateControls();

    clearTimeout(overTimeout);
    overTimeout = setTimeout(() => {
      if (state === 'over') {
        showOverlay('over', { newRecord: score > bestAtStart && score > 0 });
      }
    }, 550);
  }

  function winGame() {
    state = 'won';
    updateControls();
    burst(SIZE / 2, SIZE / 2, '#facc15', 40, 260);
    flash = 0.6;
    tone(523, 0.1, { vol: 0.07 });
    tone(659, 0.1, { delay: 0.1, vol: 0.07 });
    tone(784, 0.1, { delay: 0.2, vol: 0.07 });
    tone(1046, 0.26, { delay: 0.3, vol: 0.07 });

    clearTimeout(overTimeout);
    overTimeout = setTimeout(() => {
      if (state === 'won') showOverlay('won');
    }, 450);
  }

  function requestDir(name) {
    const d = DIRS[name];
    if (!d) return;
    const last = pendingDirs.length ? pendingDirs[pendingDirs.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return;
    if (d.x === last.x && d.y === last.y) return;
    if (pendingDirs.length < 2) pendingDirs.push({ x: d.x, y: d.y });
  }

  function inputDir(name) {
    if (state === 'menu') startGame();
    if (state === 'playing') requestDir(name);
  }

  function updateEffects(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 420 * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
    }

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      if (f.life <= 0) floaters.splice(i, 1);
      else f.y -= 28 * dt;
    }

    shake = Math.max(0, shake - shake * 6 * dt - 8 * dt);
    flash = Math.max(0, flash - dt * 1.6);
  }

  function drawBoard() {
    const g = ctx.createRadialGradient(SIZE * 0.5, SIZE * 0.45, SIZE * 0.05, SIZE * 0.5, SIZE * 0.5, SIZE * 0.75);
    g.addColorStop(0, 'rgba(34,211,238,0.10)');
    g.addColorStop(0.6, 'rgba(139,92,246,0.06)');
    g.addColorStop(1, 'rgba(7,11,20,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-16, -16, SIZE + 32, SIZE + 32);

    ctx.strokeStyle = 'rgba(148,163,184,0.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const x = i * CELL + 0.5;
      ctx.moveTo(x, 0);
      ctx.lineTo(x, SIZE);
    }
    for (let j = 1; j < ROWS; j++) {
      const y = j * CELL + 0.5;
      ctx.moveTo(0, y);
      ctx.lineTo(SIZE, y);
    }
    ctx.stroke();
  }

  function drawFood(now) {
    if (!food) return;
    const cx = (food.x + 0.5) * CELL;
    const cy = (food.y + 0.5) * CELL;
    const pulse = 1 + Math.sin(now / 230) * 0.08;
    const r = CELL * 1.05 * pulse;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    glow.addColorStop(0, rgba(food.color, 0.5));
    glow.addColorStop(0.55, rgba(food.color, 0.18));
    glow.addColorStop(1, rgba(food.color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = Math.round(CELL * 0.78 * pulse) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(food.emoji, cx, cy + 1);
  }

  function drawMonsters(now) {
    for (const monster of monsters) {
      const cx = (monster.x + 0.5) * CELL;
      const cy = (monster.y + 0.5) * CELL;
      const pulse = 1 + Math.sin(now / 180 + monster.x) * 0.08;
      const radius = CELL * pulse;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      glow.addColorStop(0, 'rgba(244,114,182,0.42)');
      glow.addColorStop(0.55, 'rgba(244,63,94,0.16)');
      glow.addColorStop(1, 'rgba(244,63,94,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = Math.round(CELL * 0.82 * pulse) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('👾', cx, cy + 1);
    }
  }

  function drawSnake(t) {
    if (!snake.length) return;

    const pts = snake.map(n => ({
      x: (n.px + (n.x - n.px) * t + 0.5) * CELL,
      y: (n.py + (n.y - n.py) * t + 0.5) * CELL
    }));
    const head = pts[0];
    const tail = pts[pts.length - 1];

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const grad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    grad.addColorStop(0, '#e2ff7a');
    grad.addColorStop(0.35, '#a3e635');
    grad.addColorStop(0.75, '#4ade80');
    grad.addColorStop(1, '#22d3ee');

    ctx.shadowColor = 'rgba(163,230,53,0.55)';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = grad;
    ctx.lineWidth = CELL * 0.76;
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = CELL * 0.2;
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    ctx.fillStyle = '#e9ff8a';
    ctx.shadowColor = 'rgba(217,255,92,0.8)';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(head.x, head.y, CELL * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    const d = dir;
    const perpX = -d.y;
    const perpY = d.x;
    const forward = CELL * 0.1;
    const side = CELL * 0.16;
    const eyeR = CELL * 0.105;
    const pupilR = CELL * 0.05;

    for (let s = -1; s <= 1; s += 2) {
      const ex = head.x + d.x * forward + perpX * side * s;
      const ey = head.y + d.y * forward + perpY * side * s;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0b1220';
      ctx.beginPath();
      ctx.arc(ex + d.x * CELL * 0.035, ey + d.y * CELL * 0.035, pupilR, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawEffects() {
    if (particles.length) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const a = Math.max(0, p.life / p.max);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    for (const f of floaters) {
      const a = Math.max(0, f.life / f.max);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color;
      ctx.font = '800 ' + Math.round(CELL * 0.62) + 'px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
  }

  function draw(now, t) {
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, SIZE, SIZE);

    ctx.save();
    if (shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBoard();
    drawFood(now);
    drawMonsters(now);
    drawSnake(t);
    drawEffects();
    ctx.restore();

    if (flash > 0.01) {
      ctx.fillStyle = 'rgba(244,63,94,' + (flash * 0.28) + ')';
      ctx.fillRect(0, 0, SIZE, SIZE);
    }
  }

  function loop(now) {
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    if (state === 'playing') {
      acc += dt * 1000;
      let guard = 0;
      while (acc >= tickMs() && guard < 5) {
        acc -= tickMs();
        step();
        guard++;
        if (state !== 'playing') {
          acc = 0;
          break;
        }
      }

      if (combo > 0) {
        comboTimer -= dt * 1000;
        if (comboTimer <= 0) {
          combo = 0;
          comboTimer = 0;
          updateHUD();
        }
      }
    }

    updateEffects(dt);
    const t = (state === 'playing' || state === 'paused') ? Math.min(1, acc / tickMs()) : 0;
    draw(now, t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    const key = e.key;

    if (key === ' ' || key === 'Spacebar' || key === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (state === 'menu' || state === 'over' || state === 'won') startGame();
      else if (state === 'playing') pauseGame();
      else if (state === 'paused') resumeGame();
      return;
    }

    if (key === 'Escape' || key === 'p' || key === 'P') {
      if (state === 'playing' || state === 'paused') {
        e.preventDefault();
        togglePause();
      }
      return;
    }

    const name = KEY_DIRS[key.toLowerCase()];
    if (!name) return;
    e.preventDefault();
    inputDir(name);
  }, { passive: false });

  stage.addEventListener('pointerdown', (e) => {
    if (e.target !== canvas) return;
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });

  stage.addEventListener('pointerup', (e) => {
    if (!swipe || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x;
    const dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.hypot(dx, dy) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) inputDir(dx > 0 ? 'right' : 'left');
    else inputDir(dy > 0 ? 'down' : 'up');
  });

  stage.addEventListener('pointercancel', () => { swipe = null; });

  document.querySelectorAll('.dpad-btn').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      inputDir(btn.dataset.dir);
    });
  });

  panel.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'start') startGame();
    else if (action === 'resume') resumeGame();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    togglePause();
  });

  muteBtn.addEventListener('click', () => {
    muteBtn.blur();
    toggleMute();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pauseGame();
  });

  window.addEventListener('resize', fitCanvas);

  fitCanvas();
  resetRun();
  state = 'menu';
  updateMuteBtn();
  updateControls();
  showOverlay('menu');
  lastFrame = performance.now();
  requestAnimationFrame(loop);
})();
</script>


<script>
/* 🐱 猫咪助手 + 设置菜单 —— 纯附加模块，不修改原有游戏逻辑 */
(() => {
  "use strict";

  const K_CAT = "neonSnake.cat.v1";
  const K_CHAT = "neonSnake.chatter.v1";
  const K_DPAD = "neonSnake.dpad.v1";

  const byId = (id) => document.getElementById(id);
  const scoreEl = byId("score");
  const comboEl = byId("combo");
  const levelEl = byId("level");
  const overlay = byId("overlay");
  const panel = byId("panel");
  const stage = byId("stage");
  const muteBtn = byId("muteBtn");
  const dpad = document.querySelector(".dpad");
  if (!scoreEl || !overlay || !panel || !stage) return;

  const load = (k, fb) => {
    try { const v = localStorage.getItem(k); return v === null ? fb : v; } catch (e) { return fb; }
  };
  const save = (k, v) => {
    try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ }
  };

  let catOn = load(K_CAT, "1") === "1";
  let chatter = load(K_CHAT, "normal");

  const dock = document.createElement("div");
  dock.id = "catDock";
  dock.dataset.mood = "default";
  dock.innerHTML = "<div id=catFace><img id=catImg src=" + CAT_IMG + " alt=cat>" + CAT_FACES + "</div><div id=catBubble></div>";
  stage.appendChild(dock);
  const bubble = dock.querySelector("#catBubble");

  let bubbleTimer = null;
  let faceTimer = null;
  let lastSay = 0;

  function say(text, mood, force) {
    if (!catOn) return;
    const now = performance.now();
    if (!force && now - lastSay < COOLDOWN[chatter]) return;
    lastSay = now;
    dock.dataset.mood = mood || "default";
    bubble.textContent = text;
    bubble.classList.add("on");
    dock.classList.add("pop");
    clearTimeout(bubbleTimer);
    clearTimeout(faceTimer);
    bubbleTimer = setTimeout(() => {
      bubble.classList.remove("on");
      dock.classList.remove("pop");
      faceTimer = setTimeout(() => { dock.dataset.mood = "default"; }, 250);
    }, chatter === "chatty" ? 3400 : 2600);
  }

  function injectSettingsButton() {
    if (!panel.isConnected || panel.querySelector("#catSetBtn")) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.id = "catSetBtn";
    btn.textContent = "🐱 猫咪助手 / 设置";
    btn.addEventListener("click", openSettings);
    panel.appendChild(btn);
  }

  const modal = document.createElement("div");
  modal.id = "catModal";
  modal.hidden = true;
  modal.innerHTML =
    "<div id=catCard>" +
      "<h3>🐱 猫咪助手</h3>" +
      "<p class=sub>我会陪你玩，并在关键时机提醒你。设置自动保存在本机。</p>" +
      "<div class=catRow><div><span>助手</span><small>关掉后猫咪不再出现</small></div><div class=catSeg data-set=cat></div></div>" +
      "<div class=catRow><div><span>话痨程度</span><small>提示的频率</small></div><div class=catSeg data-set=chatter></div></div>" +
      "<div class=catRow><div><span>方向键盘</span><small>屏幕下方的 D-pad</small></div><div class=catSeg data-set=dpad></div></div>" +
      "<div class=catRow><div><span>音效</span><small>等同右上角喇叭按钮</small></div><div class=catSeg data-set=sound></div></div>" +
      "<button type=button id=catClose>关闭</button>" +
    "</div>";
  document.body.appendChild(modal);

  const isMuted = () => (muteBtn ? muteBtn.textContent.trim() === "🔇" : false);

  function seg(host, items, current, onPick) {
    if (!host) return;
    host.innerHTML = "";
    items.forEach((it) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = it[1];
      if (it[0] === current) b.classList.add("sel");
      b.addEventListener("click", () => { onPick(it[0]); renderSettings(); });
      host.appendChild(b);
    });
  }

  function applyCat() {
    if (!catOn) {
      clearTimeout(bubbleTimer);
      clearTimeout(faceTimer);
      bubble.classList.remove("on");
      dock.classList.remove("pop");
    }
    dock.style.display = catOn ? "" : "none";
  }

  function applyDpad() {
    if (dpad) dpad.style.display = dpadOn ? "" : "none";
  }

  function renderSettings() {
    seg(modal.querySelector("[data-set=cat]"), [["1", "开"], ["0", "关"]], catOn ? "1" : "0",
      (v) => { catOn = v === "1"; save(K_CAT, v); applyCat(); });
    seg(modal.querySelector("[data-set=chatter]"),
      [["quiet", "安静"], ["normal", "普通"], ["chatty", "话痨"]], chatter,
      (v) => { chatter = v; save(K_CHAT, v); });
    seg(modal.querySelector("[data-set=dpad]"), [["1", "显示"], ["0", "隐藏"]], dpadOn ? "1" : "0",
      (v) => { dpadOn = v === "1"; save(K_DPAD, v); applyDpad(); });
    seg(modal.querySelector("[data-set=sound]"), [["on", "开"], ["off", "关"]],
      isMuted() ? "off" : "on", () => { if (muteBtn) muteBtn.click(); });
  }

  function openSettings() { renderSettings(); modal.hidden = false; }
  function closeSettings() { modal.hidden = true; }

  modal.querySelector("#catClose").addEventListener("click", closeSettings);
  modal.addEventListener("pointerdown", (e) => { if (e.target === modal) closeSettings(); });
  window.addEventListener("keydown", (e) => {
    if (!modal.hidden && e.key === "Escape") { e.stopPropagation(); closeSettings(); }
  }, true);

  let lastScore = parseInt(scoreEl.textContent, 10) || 0;
  let lastLevel = parseInt(levelEl.textContent, 10) || 1;

  function onScore() {
    const s = parseInt(scoreEl.textContent, 10) || 0;
    if (s > lastScore) {
      const gain = s - lastScore;
      const c = parseInt(String(comboEl.textContent).replace("x", ""), 10) || 1;
      if (c >= 4) say("连击 x" + c + "！2.6 秒内接着吃就能维持", "love", true);
      else if (gain >= 30) say("+" + gain + "，连击加成生效了", "happy");
      if (lastScore < 80 && s >= 80) say("快到 100 分了，怪物马上登场", "shock", true);
      if (Math.floor(lastScore / 100) < Math.floor(s / 100)) say("又多一只怪物，注意走位", "shock", true);
      if (s >= 300) say("分数越高越快，走大圈比走小圈安全", "smug");
    }
    lastScore = s;
  }

  function onLevel() {
    const l = parseInt(levelEl.textContent, 10) || 1;
    if (l > lastLevel) say("等级 " + l + "，速度提升了，别慌", "smug", true);
    lastLevel = l;
  }

  function onOverlay() {
    if (overlay.hidden) return;
    const t = panel.textContent || "";
    if (t.indexOf("GAME OVER") >= 0) {
      if (t.indexOf("신기록") >= 0) say("新纪录！你太强了 🏆", "love", true);
      else say("没关系，再来一局。记住别绕回自己的身体", "sad", true);
    } else if (t.indexOf("PERFECT") >= 0) {
      say("整张图都填满了，传说级操作", "love", true);
    } else if (t.indexOf("잠깐") >= 0) {
      say("休息一下，我在这儿等你", "default", true);
    } else if (t.indexOf("NEON") >= 0) {
      say("点 PLAY 开始。方向键 / WASD / 滑动都能操作", "default", true);
    }
    injectSettingsButton();
  }

  new MutationObserver(() => { onScore(); onLevel(); })
    .observe(scoreEl, { childList: true, characterData: true, subtree: true });
  new MutationObserver(() => { onLevel(); })
    .observe(levelEl, { childList: true, characterData: true, subtree: true });
  new MutationObserver(onOverlay)
    .observe(overlay, { attributes: true, attributeFilter: ["hidden"] });
  new MutationObserver(injectSettingsButton)
    .observe(panel, { childList: true });

  setInterval(() => {
    if (!catOn || !overlay.hidden) return;
    const s = parseInt(scoreEl.textContent, 10) || 0;
    if (s === 0) say("吃到 emoji 就得分，撞墙会结束哦", "default");
    else if (s < 100) say("连吃可以叠连击，最高 x5，一次 50 分", "happy");
    else say("贴着边走更安全，中间留给转身空间", "smug");
  }, 12000);

  applyCat();
  applyDpad();
  onOverlay();
  injectSettingsButton();
})();
</script>
</body>
</html>

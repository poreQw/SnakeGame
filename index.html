<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#070b14" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>" />
<title>NEON SNAKE · 네온 스네이크</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    background:
      radial-gradient(1100px 760px at 12% -8%, rgba(139, 92, 246, .22), transparent 62%),
      radial-gradient(900px 700px at 108% 12%, rgba(34, 211, 238, .16), transparent 58%),
      #070b14;
    color: #e2e8f0;
    font-family: "Segoe UI", "Malgun Gothic", system-ui, -apple-system, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    filter: blur(60px);
  }
  body::before {
    width: 52vmax; height: 52vmax;
    left: -18vmax; top: -20vmax;
    background: radial-gradient(circle, rgba(139, 92, 246, .5), transparent 65%);
    animation: drift-a 16s ease-in-out infinite alternate;
  }
  body::after {
    width: 46vmax; height: 46vmax;
    right: -16vmax; bottom: -18vmax;
    background: radial-gradient(circle, rgba(34, 211, 238, .35), transparent 65%);
    animation: drift-b 20s ease-in-out infinite alternate;
  }
  @keyframes drift-a { to { transform: translate3d(5vmax, 4vmax, 0) scale(1.08); } }
  @keyframes drift-b { to { transform: translate3d(-5vmax, -4vmax, 0) scale(1.12); } }

  .app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  @keyframes enter-rise {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes enter-fade {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes enter-zoom {
    from { opacity: 0; transform: scale(.94); }
    to { opacity: 1; transform: scale(1); }
  }
  h1 { animation: enter-rise .55s cubic-bezier(.2, 1, .35, 1) both; }
  .tag { animation: enter-fade .45s ease .24s both; }
  .tools { animation: enter-fade .45s ease .2s both; }
  .stat { animation: enter-rise .45s cubic-bezier(.2, 1, .35, 1) both; }
  .stat:nth-child(1) { animation-delay: .12s; }
  .stat:nth-child(2) { animation-delay: .2s; }
  .stat:nth-child(3) { animation-delay: .28s; }
  .stat:nth-child(4) { animation-delay: .36s; }
  .stage { animation: enter-zoom .55s cubic-bezier(.2, 1, .35, 1) .25s backwards; }
  .hint { animation: enter-fade .45s ease .5s both; }
  .dpad { animation: enter-rise .45s cubic-bezier(.2, 1, .35, 1) .45s both; }

  .top {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 8vw, 40px);
    line-height: 1;
    font-weight: 900;
    letter-spacing: .04em;
    filter: drop-shadow(0 0 22px rgba(34, 211, 238, .25));
  }
  h1 .grad {
    background: linear-gradient(92deg, #a3e635 0%, #22d3ee 60%, #8b5cf6 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .tag {
    margin: 7px 0 0;
    font-size: 11px;
    letter-spacing: .22em;
    color: #94a3b8;
    font-weight: 600;
  }
  .tools { display: flex; gap: 8px; flex-shrink: 0; }
  .icon-btn {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 14px;
    border: 1px solid rgba(148, 163, 184, .2);
    background: rgba(255, 255, 255, .05);
    color: #e2e8f0;
    font-size: 17px;
    cursor: pointer;
    transition: background .15s ease, opacity .15s ease, transform .15s ease;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .icon-btn:hover:not(:disabled) { background: rgba(255, 255, 255, .1); }
  .icon-btn:active:not(:disabled) { transform: scale(.94); }
  .icon-btn:disabled { opacity: .32; cursor: default; }
  .icon-btn.off { opacity: .55; }

  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .stat {
    min-width: 0;
    padding: 8px 12px;
    border-radius: 16px;
    border: 1px solid rgba(148, 163, 184, .16);
    background: linear-gradient(180deg, rgba(255, 255, 255, .06), rgba(255, 255, 255, .02));
    display: flex;
    flex-direction: column;
    gap: 2px;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .stat .label {
    font-size: 10px;
    letter-spacing: .14em;
    color: #94a3b8;
    text-transform: uppercase;
    font-weight: 600;
  }
  .stat strong {
    font-size: clamp(16px, 4.5vw, 20px);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.15;
  }
  #best {
    background: linear-gradient(92deg, #a3e635, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #combo { color: #94a3b8; }
  .combo.hot {
    border-color: rgba(244, 114, 182, .6);
    box-shadow: 0 0 18px rgba(244, 114, 182, .3), inset 0 0 14px rgba(244, 114, 182, .1);
  }
  .combo.hot #combo { color: #f472b6; }

  .stage {
    position: relative;
    width: min(520px, 94vw, 62vh);
    aspect-ratio: 1 / 1;
    margin-inline: auto;
    padding: 2px;
    border-radius: 26px;
    background: linear-gradient(150deg, rgba(163, 230, 53, .85), rgba(34, 211, 238, .5) 45%, rgba(139, 92, 246, .85));
    box-shadow:
      0 0 34px rgba(34, 211, 238, .16),
      0 26px 60px rgba(0, 0, 0, .6);
  }
  #game {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 24px;
    background: #070b14;
    touch-action: none;
  }

  .overlay {
    position: absolute;
    inset: 2px;
    z-index: 5;
    display: grid;
    place-items: center;
    padding: 18px;
    overflow: auto;
    border-radius: 24px;
    background: rgba(6, 10, 18, .6);
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }
  .overlay[hidden] { display: none; }

  .panel {
    width: 100%;
    max-width: 340px;
    text-align: center;
  }
  .panel.in { animation: pop .34s cubic-bezier(.2, 1.25, .35, 1); }
  @keyframes pop {
    from { opacity: 0; transform: scale(.9) translateY(10px); }
    to { opacity: 1; transform: none; }
  }
  .panel-emoji {
    font-size: 44px;
    line-height: 1;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 18px rgba(163, 230, 53, .45));
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: clamp(22px, 6vw, 29px);
    font-weight: 900;
    letter-spacing: .02em;
  }
  .panel h2 .grad {
    background: linear-gradient(92deg, #a3e635, #22d3ee);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .panel p {
    margin: 0 0 18px;
    color: #94a3b8;
    font-size: 13px;
    line-height: 1.6;
  }
  .panel p b { color: #e2e8f0; }
  .panel .small {
    margin: 12px 0 0;
    font-size: 11px;
    color: rgba(148, 163, 184, .75);
  }
  .panel .btn.secondary {
    margin-top: 10px;
    border: 1px solid rgba(148, 163, 184, .24);
    color: #cbd5e1;
    background: rgba(255, 255, 255, .06);
    box-shadow: none;
  }
  .panel .tutorial-progress {
    margin: 0 0 8px;
    color: #a3e635;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .12em;
  }
  .panel .tutorial-actions {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
  }
  .panel .tutorial-actions .btn { padding: 11px 20px; }
  .panel .tutorial-actions .btn.secondary { margin-top: 0; }
  .panel .new-record {
    margin: -4px 0 16px;
    color: #a3e635;
    font-weight: 800;
    font-size: 15px;
    text-shadow: 0 0 16px rgba(163, 230, 53, .5);
  }
  .panel .intro-list {
    display: grid;
    gap: 7px;
    margin: 0 0 14px;
    padding: 0;
    list-style: none;
    text-align: left;
  }
  .panel .intro-list li {
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid rgba(148, 163, 184, .14);
    background: rgba(255, 255, 255, .045);
  }
  .panel .intro-list b {
    display: block;
    font-size: 12.5px;
    color: #e2e8f0;
  }
  .panel .intro-list span {
    display: block;
    margin-top: 2px;
    font-size: 11.5px;
    line-height: 1.5;
    color: #94a3b8;
  }
  .panel .intro-keys {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin: 0 0 16px;
  }
  .panel .intro-keys kbd {
    font: inherit;
    font-size: 11px;
    font-weight: 700;
    color: #22d3ee;
    padding: 3px 9px;
    border-radius: 7px;
    border: 1px solid rgba(34, 211, 238, .28);
    background: rgba(34, 211, 238, .08);
  }
  .panel.intro .panel-emoji {
    font-size: 34px;
    margin-bottom: 3px;
  }
  .panel.intro h2 {
    font-size: clamp(20px, 5.4vw, 25px);
    margin-bottom: 6px;
  }
  .panel.intro p {
    margin-bottom: 12px;
    font-size: 12.5px;
  }
  .panel.intro .intro-list {
    gap: 5px;
    margin-bottom: 12px;
  }
  .panel.intro .intro-list li { padding: 6px 10px; }
  .panel.intro .intro-keys { margin-bottom: 12px; }
  .panel.intro .small { margin-top: 9px; }
  .panel.intro .intro-list li { animation: enter-rise .35s ease both; }
  .panel.intro .intro-list li:nth-child(1) { animation-delay: .12s; }
  .panel.intro .intro-list li:nth-child(2) { animation-delay: .22s; }
  .panel.intro .intro-list li:nth-child(3) { animation-delay: .32s; }
  .btn {
    border: 0;
    cursor: pointer;
    font: inherit;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: .03em;
    color: #07110a;
    padding: 13px 30px;
    border-radius: 999px;
    background: linear-gradient(100deg, #a3e635, #22d3ee);
    box-shadow:
      0 10px 26px rgba(34, 211, 238, .28),
      inset 0 1px 0 rgba(255, 255, 255, .35);
    transition: transform .15s ease, filter .15s ease, box-shadow .15s ease;
  }
  .btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .btn:active { transform: scale(.97); }

  .result {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 0 0 16px;
  }
  .result div {
    min-width: 96px;
    padding: 8px 16px;
    border-radius: 14px;
    border: 1px solid rgba(148, 163, 184, .16);
    background: rgba(255, 255, 255, .05);
  }
  .result span {
    display: block;
    font-size: 10px;
    letter-spacing: .14em;
    color: #94a3b8;
    font-weight: 600;
  }
  .result b {
    font-size: 21px;
    font-variant-numeric: tabular-nums;
  }

  .hint {
    margin: 0;
    text-align: center;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: .02em;
  }

  .dpad {
    display: none;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    grid-template-areas:
      ". up ."
      "left down right";
    gap: 8px;
    justify-content: center;
    margin-top: 2px;
  }
  .dpad-btn {
    border-radius: 18px;
    border: 1px solid rgba(148, 163, 184, .22);
    background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(255, 255, 255, .03));
    color: #22d3ee;
    font-size: 18px;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    transition: transform .12s ease, background .12s ease, color .12s ease;
  }
  .dpad-btn:active {
    transform: scale(.94);
    background: rgba(34, 211, 238, .2);
    color: #fff;
  }
  .dpad-btn[data-dir="up"] { grid-area: up; }
  .dpad-btn[data-dir="left"] { grid-area: left; }
  .dpad-btn[data-dir="down"] { grid-area: down; }
  .dpad-btn[data-dir="right"] { grid-area: right; }

  .project-ppt-link {
    position: fixed;
    left: max(14px, env(safe-area-inset-left));
    bottom: max(14px, env(safe-area-inset-bottom));
    z-index: 39;
    display: grid;
    width: 46px;
    height: 46px;
    place-items: center;
    border: 1px solid rgba(34, 211, 238, .4);
    border-radius: 50%;
    background: linear-gradient(145deg, rgba(163, 230, 53, .2), rgba(34, 211, 238, .18));
    box-shadow: 0 8px 24px rgba(0, 0, 0, .4), 0 0 18px rgba(34, 211, 238, .14);
    color: #e2e8f0;
    font-size: 20px;
    text-decoration: none;
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .project-ppt-link:hover {
    transform: translateY(-2px);
    border-color: rgba(34, 211, 238, .75);
    background: linear-gradient(145deg, rgba(163, 230, 53, .32), rgba(34, 211, 238, .3));
  }
  .project-ppt-link:active { transform: scale(.94); }

  .ppt-viewer[hidden] { display: none; }
  .ppt-viewer {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: grid;
    place-items: center;
    padding: 18px;
    background: rgba(3, 7, 14, .82);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  .ppt-window {
    display: flex;
    flex-direction: column;
    width: min(900px, 100%);
    max-height: min(760px, calc(100dvh - 36px));
    overflow: hidden;
    border: 1px solid rgba(34, 211, 238, .28);
    border-radius: 24px;
    background: #080e19;
    box-shadow: 0 28px 90px rgba(0, 0, 0, .65), 0 0 42px rgba(34, 211, 238, .08);
  }
  .ppt-toolbar, .ppt-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 13px 18px;
    border-bottom: 1px solid rgba(148, 163, 184, .13);
  }
  .ppt-toolbar strong { color: #e2e8f0; font-size: 13px; }
  .ppt-toolbar button, .ppt-footer button, .ppt-footer a {
    border: 1px solid rgba(148, 163, 184, .24);
    border-radius: 10px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, .05);
    color: #cbd5e1;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
  }
  .ppt-toolbar button:hover, .ppt-footer button:hover, .ppt-footer a:hover { background: rgba(255, 255, 255, .1); }
  .ppt-content { overflow: auto; padding: clamp(18px, 4vw, 34px); }
  .ppt-slide-label { margin: 0 0 8px; color: #a3e635; font-size: 11px; font-weight: 800; letter-spacing: .13em; }
  .ppt-content h2 { margin: 0; color: #e2e8f0; font-size: clamp(24px, 5vw, 38px); line-height: 1.15; }
  .ppt-subtitle { margin: 10px 0 22px; color: #94a3b8; font-size: 14px; line-height: 1.6; }
  .ppt-reveals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .ppt-item {
    min-width: 0;
    padding: 16px;
    border: 1px solid rgba(148, 163, 184, .14);
    border-radius: 16px;
    background: linear-gradient(145deg, rgba(255, 255, 255, .055), rgba(255, 255, 255, .02));
    animation: enter-rise .3s ease both;
  }
  .ppt-item strong { display: block; margin-bottom: 6px; color: #22d3ee; font-size: 14px; }
  .ppt-item p { margin: 0; color: #cbd5e1; font-size: 12px; line-height: 1.65; white-space: pre-line; }
  .ppt-item .ppt-emoji { margin-bottom: 6px; font-size: 20px; }
  .ppt-reveals .ppt-item:first-child:last-child { grid-column: 1 / -1; }
  .ppt-footer { border-top: 1px solid rgba(148, 163, 184, .13); border-bottom: 0; }
  .ppt-progress { color: #94a3b8; font-size: 11px; white-space: nowrap; }
  .ppt-controls { display: flex; gap: 8px; }
  .ppt-footer button.primary {
    border-color: transparent;
    background: linear-gradient(100deg, #a3e635, #22d3ee);
    color: #07110a;
  }
  .ppt-footer button:disabled { opacity: .38; cursor: default; }
  @media (max-width: 560px) {
    .ppt-viewer { padding: 10px; }
    .ppt-window { max-height: calc(100dvh - 20px); border-radius: 18px; }
    .ppt-toolbar, .ppt-footer { padding: 10px 12px; }
    .ppt-toolbar strong { font-size: 11px; }
    .ppt-reveals { grid-template-columns: 1fr; }
    .ppt-item { padding: 13px; }
    .ppt-progress { font-size: 10px; }
  }

  @media (pointer: coarse), (hover: none) {
    .dpad { display: grid; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001ms !important;
    }
  }
  :focus-visible { outline: 2px solid #22d3ee; outline-offset: 2px; }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>NEON <span class="grad">SNAKE</span></h1>
      <p class="tag">EAT · GROW · GLOW</p>
    </div>
    <div class="tools">
      <button id="muteBtn" class="icon-btn" type="button" aria-label="소리 끄기" title="소리 끄기">🔊</button>
      <button id="pauseBtn" class="icon-btn" type="button" aria-label="일시정지" title="일시정지" disabled>⏸️</button>
    </div>
  </header>

  <section class="stats" aria-label="점수">
    <div class="stat"><span class="label">점수</span><strong id="score">0</strong></div>

    <div class="stat combo" id="comboStat"><span class="label">콤보</span><strong id="combo">x1</strong></div>
    <div class="stat"><span class="label">레벨</span><strong id="level">1</strong></div>
  </section>

  <section class="stage" id="stage">
    <canvas id="game" width="520" height="520" aria-label="네온 스네이크 게임 화면"></canvas>
    <div class="overlay" id="overlay" hidden>
      <div class="panel" id="panel"></div>
    </div>
  </section>

  <p class="hint">방향키 / WASD · 스와이프로 조작 &nbsp;|&nbsp; Space 일시정지</p>

  <div class="dpad" aria-label="터치 조작">
    <button type="button" class="dpad-btn" data-dir="up" aria-label="위">▲</button>
    <button type="button" class="dpad-btn" data-dir="left" aria-label="왼쪽">◀</button>
    <button type="button" class="dpad-btn" data-dir="down" aria-label="아래">▼</button>

</main>
<button class="project-ppt-link" id="projectPptButton" type="button" aria-haspopup="dialog" aria-controls="pptViewer" aria-label="NEON SNAKE 프로젝트 소개 보기" title="프로젝트 소개 보기">📘</button>
<section class="ppt-viewer" id="pptViewer" role="dialog" aria-modal="true" aria-labelledby="pptViewerTitle" hidden>
  <div class="ppt-window">
    <header class="ppt-toolbar">
      <strong id="pptViewerTitle">NEON SNAKE · 프로젝트 소개</strong>
      <button type="button" id="pptCloseButton" aria-label="소개 닫기">닫기 ✕</button>

      </div>

  </div>
</section>

<script>
(() => {
  'use strict';

  const COLS = 20;
  const ROWS = 20;
  const SIZE = 520;
  const CELL = SIZE / COLS;
  const MONSTER_SCORE_STEP = 100;
  const MAX_MONSTERS = 3;

  const FOODS = [

  function readStore(key, fallback) {
    try {
      const value = localStorage.getItem(key);
      return value === null ? fallback : value;
    } catch (err) {
      return fallback;
    }
  }

  function writeStore(key, value) {
    try { localStorage.setItem(key, value); } catch (err) { /* storage unavailable */ }
  }

  best = parseInt(readStore(STORE_BEST, '0'), 10);
  if (!Number.isFinite(best) || best < 0) best = 0;
  muted = readStore(STORE_MUTE, '0') === '1';

  function rgba(hex, alpha) {
    const n = parseInt(hex.slice(1), 16);
    return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
  }

  function fitCanvas() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(SIZE * dpr);
    canvas.height = Math.round(SIZE * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function audio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(freq, dur = 0.12, opts = {}) {
    if (muted) return;
    const ac = audio();
    if (!ac) return;
    const to = opts.to;
    const type = opts.type || 'triangle';
    const vol = opts.vol == null ? 0.08 : opts.vol;
    const delay = opts.delay || 0;
    const t0 = ac.currentTime + delay;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(Math.max(30, to), t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ac.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function vibrate(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (err) { /* ignore */ }
  }

  function getLevel() {
    return 1 + Math.floor(score / 60);
  }

  function tickMs() {
    return Math.max(72, 160 - (getLevel() - 1) * 12);
  }

    scoreEl.textContent = String(score);

    pauseBtn.disabled = !(state === 'playing' || state === 'paused');
  }

    panel.className = 'panel' + (kind === 'intro' ? ' intro' : '') + (kind === 'tutorial' ? ' tutorial' : '');
    panel.dataset.tutorial = kind === 'tutorial' ? 'true' : 'false';

  }

  function advanceTutorial(direction) {

    showOverlay('tutorial');

  function spawnFood() {
    const occupied = new Set([
      ...snake.map(n => n.y * COLS + n.x),
      ...monsters.map(monster => monster.y * COLS + monster.x)
    ]);
    const free = [];
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        if (!occupied.has(y * COLS + x)) free.push({ x, y });
      }
    }
    if (!free.length) {
      food = null;
      return false;
    }
    const spot = free[(Math.random() * free.length) | 0];
    const type = FOODS[(Math.random() * FOODS.length) | 0];
    food = { x: spot.x, y: spot.y, emoji: type.emoji, color: type.color };
    return true;
  }

  function spawnMonstersForScore() {
    const targetCount = Math.min(MAX_MONSTERS, Math.floor(score / MONSTER_SCORE_STEP));
    while (monsters.length < targetCount) {
      const occupied = new Set([
        ...snake.map(n => n.y * COLS + n.x),
        ...monsters.map(monster => monster.y * COLS + monster.x)
      ]);
      const free = [];
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (!occupied.has(y * COLS + x) && (!food || food.x !== x || food.y !== y)) {
            free.push({ x, y });
          }
        }
      }
      if (!free.length) return;

      const head = snake[0];
      const distant = free.filter(cell => Math.abs(cell.x - head.x) + Math.abs(cell.y - head.y) >= 6);
      const choices = distant.length ? distant : free;
      const spot = choices[(Math.random() * choices.length) | 0];
      monsters.push(spot);
      floaters.push({
        x: (spot.x + 0.5) * CELL,
        y: (spot.y + 0.5) * CELL,
        text: 'MONSTER!',
        color: '#f472b6',
        life: 1.2,
        max: 1.2
      });
      tone(180, 0.2, { to: 320, type: 'sawtooth', vol: 0.07 });
    }
  }

  function moveMonsters() {
    const occupiedBySnake = new Set(snake.map(n => n.y * COLS + n.x));
    for (let i = 0; i < monsters.length; i++) {
      const monster = monsters[i];
      const occupiedByMonsters = new Set(
        monsters.filter((_, index) => index !== i).map(other => other.y * COLS + other.x)
      );
      const choices = Object.values(DIRS)
        .map(direction => ({ x: monster.x + direction.x, y: monster.y + direction.y }))
        .filter(cell =>
          cell.x >= 0 && cell.y >= 0 && cell.x < COLS && cell.y < ROWS &&
          !occupiedBySnake.has(cell.y * COLS + cell.x) &&
          !occupiedByMonsters.has(cell.y * COLS + cell.x) &&
          (!food || food.x !== cell.x || food.y !== cell.y)
        );
      if (choices.length) {
        const next = choices[(Math.random() * choices.length) | 0];
        monster.x = next.x;
        monster.y = next.y;
      }
    }
  }

  function shrinkSnakeOnHit() {
    if (snake.length <= 1) {
      die();
      return false;
    }
    snake.pop();
    const head = snake[0];
    const x = (head.x + 0.5) * CELL;
    const y = (head.y + 0.5) * CELL;
    burst(x, y, '#fb7185', 8, 150);
    floaters.push({ x, y: y - CELL * 0.3, text: '-1', color: '#fb7185', life: 0.75, max: 0.75 });
    shake = Math.max(shake, 8);
    tone(220, 0.16, { to: 90, type: 'sawtooth', vol: 0.08 });
    vibrate(18);
    return true;
  }

  function resetRun() {
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [];
    for (let i = 0; i < 4; i++) {
      snake.push({ x: cx - i, y: cy, px: cx - i, py: cy });
    }
    dir = { x: 1, y: 0 };
    pendingDirs = [];
    monsters = [];
    monsterMoveCounter = 0;
    score = 0;
    combo = 0;
    comboTimer = 0;
    acc = 0;
    particles = [];
    floaters = [];
    shake = 0;
    flash = 0;
    bestAtStart = best;
    spawnFood();
    updateHUD();
  }

  function startGame() {
    clearTimeout(overTimeout);
    if (state === 'intro') writeStore(STORE_INTRO, '1');
    resetRun();
    state = 'playing';
    lastFrame = performance.now();
    hideOverlay();
    updateControls();
    tone(523, 0.09, { vol: 0.07 });
    tone(784, 0.1, { delay: 0.09, vol: 0.07 });
    tone(1046, 0.12, { delay: 0.19, vol: 0.06 });
  }

  function pauseGame() {
    if (state !== 'playing') return;
    state = 'paused';
    showOverlay('pause');
    tone(440, 0.08, { type: 'square', vol: 0.05 });
  }

  function resumeGame() {
    if (state !== 'paused') return;
    state = 'playing';
    lastFrame = performance.now();
    hideOverlay();
    updateControls();
    tone(660, 0.08, { vol: 0.06 });
  }

  function togglePause() {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }

  function toggleMute() {
    muted = !muted;
    writeStore(STORE_MUTE, muted ? '1' : '0');
    updateMuteBtn();
    if (!muted) tone(880, 0.08, { vol: 0.06 });
  }

  function burst(x, y, color, count, speed) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const s = speed * (0.3 + Math.random() * 1.1);
      const life = 0.45 + Math.random() * 0.5;
      particles.push({
        x,
        y,
        vx: Math.cos(angle) * s,
        vy: Math.sin(angle) * s - 30,
        life,
        max: life,
        size: 2 + Math.random() * 4,
        color
      });
    }
  }

  function levelUpFx() {
    floaters.push({
      x: SIZE / 2,
      y: SIZE / 2,
      text: 'SPEED UP ⚡',
      color: '#facc15',
      life: 1.1,
      max: 1.1
    });
    tone(784, 0.1, { vol: 0.07 });
    tone(988, 0.12, { delay: 0.09, vol: 0.06 });
    shake = Math.max(shake, 4);
  }

  function eat() {
    const px = (food.x + 0.5) * CELL;
    const py = (food.y + 0.5) * CELL;
    const color = food.color;
    const levelBefore = getLevel();

    combo = comboTimer > 0 ? Math.min(combo + 1, 9) : 1;
    comboTimer = 2600;
    const multi = Math.min(combo, 5);
    const gained = 10 * multi;
    score += gained;

    if (score > best) {
      best = score;
      writeStore(STORE_BEST, String(best));
    }

    burst(px, py, color, 16, 170);
    burst(px, py, '#ffffff', 6, 90);
    floaters.push({ x: px, y: py - CELL * 0.2, text: '+' + gained, color, life: 0.9, max: 0.9 });
    if (multi > 1) {
      floaters.push({
        x: px,
        y: py - CELL * 0.95,
        text: 'COMBO x' + multi,
        color: '#f472b6',
        life: 1.1,
        max: 1.1
      });
    }
    shake = Math.max(shake, 3.5);
    vibrate(12);

    if (combo >= 2 && comboStat.animate) {
      comboStat.animate(
        [{ transform: 'scale(1.16)' }, { transform: 'scale(1)' }],
        { duration: 220, easing: 'ease-out' }
      );
    }

    updateHUD();

    food = null;
    spawnMonstersForScore();
    const hasMore = spawnFood();

    const base = 520 + combo * 70;
    tone(base, 0.09, { vol: 0.08 });
    tone(base * 1.5, 0.12, { delay: 0.06, vol: 0.07 });

    if (getLevel() > levelBefore) levelUpFx();
    if (!hasMore) winGame();
  }

  function step() {
    if (pendingDirs.length) dir = pendingDirs.shift();

    const head = snake[0];
    const nx = head.x + dir.x;
    const ny = head.y + dir.y;

    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS) {
      die();
      return;
    }

    if (monsters.some(monster => monster.x === nx && monster.y === ny)) {
      if (shrinkSnakeOnHit()) {
        moveMonsters();
        monsterMoveCounter = 0;
      }
      return;
    }

    const willGrow = !!food && nx === food.x && ny === food.y;
    const bodyLimit = willGrow ? snake.length : snake.length - 1;
    for (let i = 0; i < bodyLimit; i++) {
      if (snake[i].x === nx && snake[i].y === ny) {
        shrinkSnakeOnHit();
        return;
      }
    }

    snake.unshift({ x: nx, y: ny, px: head.x, py: head.y });
    if (!willGrow) snake.pop();
    if (willGrow) eat();
    if (state === 'playing' && monsters.length) {
      monsterMoveCounter++;
      if (monsterMoveCounter >= 3) {
        moveMonsters();
        monsterMoveCounter = 0;
      }
    }
  }

  function die() {
    state = 'over';
    shake = 18;
    flash = 1;

    snake.forEach((n, i) => {
      const x = (n.x + 0.5) * CELL;
      const y = (n.y + 0.5) * CELL;
      const color = i === 0 ? '#d9ff5c' : (i % 2 ? '#22d3ee' : '#a3e635');
      burst(x, y, color, 3, 120);
    });

    tone(300, 0.5, { to: 60, type: 'sawtooth', vol: 0.13 });
    tone(180, 0.6, { to: 40, type: 'square', vol: 0.08, delay: 0.06 });
    vibrate([20, 50, 40]);
    updateControls();

    clearTimeout(overTimeout);
    overTimeout = setTimeout(() => {
      if (state === 'over') {
        showOverlay('over', { newRecord: score > bestAtStart && score > 0 });
      }
    }, 550);
  }

  function winGame() {
    state = 'won';
    updateControls();
    burst(SIZE / 2, SIZE / 2, '#facc15', 40, 260);
    flash = 0.6;
    tone(523, 0.1, { vol: 0.07 });
    tone(659, 0.1, { delay: 0.1, vol: 0.07 });
    tone(784, 0.1, { delay: 0.2, vol: 0.07 });
    tone(1046, 0.26, { delay: 0.3, vol: 0.07 });

    clearTimeout(overTimeout);
    overTimeout = setTimeout(() => {
      if (state === 'won') showOverlay('won');
    }, 450);
  }

  function requestDir(name) {
    const d = DIRS[name];
    if (!d) return;
    const last = pendingDirs.length ? pendingDirs[pendingDirs.length - 1] : dir;
    if (d.x === -last.x && d.y === -last.y) return;
    if (d.x === last.x && d.y === last.y) return;
    if (pendingDirs.length < 2) pendingDirs.push({ x: d.x, y: d.y });
  }

  function inputDir(name) {
    if (state === 'menu') startGame();
    if (state === 'playing') requestDir(name);
  }

  function updateEffects(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 420 * dt;
      p.vx *= 0.985;
      p.vy *= 0.985;
    }

    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.life -= dt;
      if (f.life <= 0) floaters.splice(i, 1);
      else f.y -= 28 * dt;
    }

    shake = Math.max(0, shake - shake * 6 * dt - 8 * dt);
    flash = Math.max(0, flash - dt * 1.6);
  }

  function drawBoard() {
    const g = ctx.createRadialGradient(SIZE * 0.5, SIZE * 0.45, SIZE * 0.05, SIZE * 0.5, SIZE * 0.5, SIZE * 0.75);
    g.addColorStop(0, 'rgba(34,211,238,0.10)');
    g.addColorStop(0.6, 'rgba(139,92,246,0.06)');
    g.addColorStop(1, 'rgba(7,11,20,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-16, -16, SIZE + 32, SIZE + 32);

    ctx.strokeStyle = 'rgba(148,163,184,0.09)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 1; i < COLS; i++) {
      const x = i * CELL + 0.5;
      ctx.moveTo(x, 0);
      ctx.lineTo(x, SIZE);
    }
    for (let j = 1; j < ROWS; j++) {
      const y = j * CELL + 0.5;
      ctx.moveTo(0, y);
      ctx.lineTo(SIZE, y);
    }
    ctx.stroke();
  }

  function drawFood(now) {
    if (!food) return;
    const cx = (food.x + 0.5) * CELL;
    const cy = (food.y + 0.5) * CELL;
    const pulse = 1 + Math.sin(now / 230) * 0.08;
    const r = CELL * 1.05 * pulse;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    glow.addColorStop(0, rgba(food.color, 0.5));
    glow.addColorStop(0.55, rgba(food.color, 0.18));
    glow.addColorStop(1, rgba(food.color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.font = Math.round(CELL * 0.78 * pulse) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(food.emoji, cx, cy + 1);
  }

  function drawMonsters(now) {
    for (const monster of monsters) {
      const cx = (monster.x + 0.5) * CELL;
      const cy = (monster.y + 0.5) * CELL;
      const pulse = 1 + Math.sin(now / 180 + monster.x) * 0.08;
      const radius = CELL * pulse;
      const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
      glow.addColorStop(0, 'rgba(244,114,182,0.42)');
      glow.addColorStop(0.55, 'rgba(244,63,94,0.16)');
      glow.addColorStop(1, 'rgba(244,63,94,0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = Math.round(CELL * 0.82 * pulse) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('👾', cx, cy + 1);
    }
  }

  function drawSnake(t) {
    if (!snake.length) return;

    const pts = snake.map(n => ({
      x: (n.px + (n.x - n.px) * t + 0.5) * CELL,
      y: (n.py + (n.y - n.py) * t + 0.5) * CELL
    }));
    const head = pts[0];
    const tail = pts[pts.length - 1];

    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const grad = ctx.createLinearGradient(head.x, head.y, tail.x, tail.y);
    grad.addColorStop(0, '#e2ff7a');
    grad.addColorStop(0.35, '#a3e635');
    grad.addColorStop(0.75, '#4ade80');
    grad.addColorStop(1, '#22d3ee');

    ctx.shadowColor = 'rgba(163,230,53,0.55)';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = grad;
    ctx.lineWidth = CELL * 0.76;
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = CELL * 0.2;
    ctx.beginPath();
    ctx.moveTo(head.x, head.y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();

    ctx.fillStyle = '#e9ff8a';
    ctx.shadowColor = 'rgba(217,255,92,0.8)';
    ctx.shadowBlur = 20;
    ctx.beginPath();
    ctx.arc(head.x, head.y, CELL * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    const d = dir;
    const perpX = -d.y;
    const perpY = d.x;
    const forward = CELL * 0.1;
    const side = CELL * 0.16;
    const eyeR = CELL * 0.105;
    const pupilR = CELL * 0.05;

    for (let s = -1; s <= 1; s += 2) {
      const ex = head.x + d.x * forward + perpX * side * s;
      const ey = head.y + d.y * forward + perpY * side * s;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ex, ey, eyeR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0b1220';
      ctx.beginPath();
      ctx.arc(ex + d.x * CELL * 0.035, ey + d.y * CELL * 0.035, pupilR, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawEffects() {
    if (particles.length) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      for (const p of particles) {
        const a = Math.max(0, p.life / p.max);
        ctx.globalAlpha = a;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.6), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    for (const f of floaters) {
      const a = Math.max(0, f.life / f.max);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = f.color;
      ctx.font = '800 ' + Math.round(CELL * 0.62) + 'px "Segoe UI", "Malgun Gothic", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 12;
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
  }

  function draw(now, t) {
    ctx.fillStyle = '#070b14';
    ctx.fillRect(0, 0, SIZE, SIZE);

    ctx.save();
    if (shake > 0.1) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBoard();
    drawFood(now);
    drawMonsters(now);
    drawSnake(t);
    drawEffects();
    ctx.restore();

    if (flash > 0.01) {
      ctx.fillStyle = 'rgba(244,63,94,' + (flash * 0.28) + ')';
      ctx.fillRect(0, 0, SIZE, SIZE);
    }
  }

  function loop(now) {
    const dt = Math.min(0.1, (now - lastFrame) / 1000);
    lastFrame = now;

    if (state === 'playing') {
      acc += dt * 1000;
      let guard = 0;
      while (acc >= tickMs() && guard < 5) {
        acc -= tickMs();
        step();
        guard++;
        if (state !== 'playing') {
          acc = 0;
          break;
        }
      }

      if (combo > 0) {
        comboTimer -= dt * 1000;
        if (comboTimer <= 0) {
          combo = 0;
          comboTimer = 0;
          updateHUD();
        }
      }
    }

    updateEffects(dt);
    const t = (state === 'playing' || state === 'paused') ? Math.min(1, acc / tickMs()) : 0;
    draw(now, t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', (e) => {
    const key = e.key;

    if (key === ' ' || key === 'Spacebar' || key === 'Enter') {
      e.preventDefault();
      if (e.repeat) return;
      if (panel.dataset.tutorial === 'true') {
        if (tutorialStep < TUTORIAL_STEPS.length - 1) advanceTutorial(1);
        else startGame();
      } else if (state === 'intro' || state === 'menu' || state === 'over' || state === 'won') startGame();
      else if (state === 'playing') pauseGame();
      else if (state === 'paused') resumeGame();
      return;
    }

    if (key === 'Escape' || key === 'p' || key === 'P') {
      if (key === 'Escape' && panel.dataset.tutorial === 'true') {
        e.preventDefault();
        exitTutorial();
        return;
      }
      if (state === 'playing' || state === 'paused') {
        e.preventDefault();
        togglePause();
      }
      return;
    }

    const name = KEY_DIRS[key.toLowerCase()];
    if (!name) return;
    e.preventDefault();
    inputDir(name);
  }, { passive: false });

  stage.addEventListener('pointerdown', (e) => {
    if (e.target !== canvas) return;
    swipe = { x: e.clientX, y: e.clientY, id: e.pointerId };
  });

  stage.addEventListener('pointerup', (e) => {
    if (!swipe || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x;
    const dy = e.clientY - swipe.y;
    swipe = null;
    if (Math.hypot(dx, dy) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) inputDir(dx > 0 ? 'right' : 'left');
    else inputDir(dy > 0 ? 'down' : 'up');
  });

  stage.addEventListener('pointercancel', () => { swipe = null; });

  document.querySelectorAll('.dpad-btn').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      inputDir(btn.dataset.dir);
    });
  });

  panel.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'start') startGame();
    else if (action === 'resume') resumeGame();
    else if (action === 'tutorial-open') openTutorial();
    else if (action === 'tutorial-next') advanceTutorial(1);
    else if (action === 'tutorial-prev') advanceTutorial(-1);
    else if (action === 'tutorial-exit') exitTutorial();
  });

  pauseBtn.addEventListener('click', () => {
    pauseBtn.blur();
    togglePause();
  });

  muteBtn.addEventListener('click', () => {
    muteBtn.blur();
    toggleMute();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state === 'playing') pauseGame();
  });

  window.addEventListener('resize', fitCanvas);

  fitCanvas();
  resetRun();
  state = readStore(STORE_INTRO, '0') === '1' ? 'menu' : 'intro';
  updateMuteBtn();
  updateControls();
  showOverlay(state);
  lastFrame = performance.now();
  requestAnimationFrame(loop);
})();
</script>

  const css = document.createElement("style");
  css.textContent = `
    #catDock{position:fixed;right:14px;bottom:14px;z-index:40;pointer-events:none;display:flex;flex-direction:row-reverse;align-items:flex-end;gap:6px}
    #catFace{width:56px;aspect-ratio:120/104;flex-shrink:0;position:relative}
        #catImg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
    #catImgFull{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:none}
    #catDock[data-mood=default] #catImgFull{display:block}
    #catDock[data-mood=default] #catImg,#catDock[data-mood=default] #catFaces{display:none}
    #catFaces{position:absolute;inset:0;width:100%;height:100%}
    #catFaces g{display:none}
    #catDock[data-mood=default] .e-wink,#catDock[data-mood=default] .m-tongue{display:inline}
    #catDock[data-mood=happy] .e-happy,#catDock[data-mood=happy] .m-smile{display:inline}
    #catDock[data-mood=love] .e-happy,#catDock[data-mood=love] .m-tongue,#catDock[data-mood=love] .blush{display:inline}
    #catDock[data-mood=smug] .e-wink,#catDock[data-mood=smug] .m-smile{display:inline}
    #catDock[data-mood=shock] .e-wide,#catDock[data-mood=shock] .m-open{display:inline}
    #catDock[data-mood=sad] .e-sad,#catDock[data-mood=sad] .m-frown{display:inline}
    #catDock[data-mood=happy] #catFace{transform:rotate(2deg) scale(1.08)}
    #catDock[data-mood=love] #catFace{filter:drop-shadow(0 0 6px rgba(244,114,182,.85))}
    #catDock[data-mood=smug] #catFace{transform:rotate(5deg)}
    #catDock[data-mood=shock] #catFace{transform:scale(1.16)}
    #catDock[data-mood=sad] #catFace{filter:grayscale(.55);transform:rotate(-6deg)}
    #catDock.pop #catFace{transform:rotate(3deg) scale(1.12)}
    #catFace{cursor:grab;pointer-events:auto;touch-action:none}
    #catDock.drag #catFace{cursor:grabbing;animation:catSwing .45s ease-in-out infinite alternate}
    @keyframes catSwing{from{transform:rotate(-9deg) scale(1.06)}to{transform:rotate(9deg) scale(1.06)}}
    #catBubble{max-width:min(240px,65vw);padding:7px 10px;border-radius:12px;border:1px solid rgba(34,211,238,.35);background:rgba(7,11,20,.9);color:#e2e8f0;font-size:11.5px;line-height:1.45;white-space:pre-line;box-shadow:0 6px 18px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s}
    #catBubble.on{opacity:1;transform:none}
    #catSetBtn{margin-top:10px;width:100%;border:1px solid rgba(148,163,184,.28);background:rgba(255,255,255,.06);color:#e2e8f0;font:inherit;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;cursor:pointer}
    #catSetBtn:active{transform:scale(.97)}
    #catModal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(6,10,18,.72);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
    #catModal[hidden]{display:none}
    #catCard{width:100%;max-width:360px;max-height:calc(100dvh - 40px);overflow-y:auto;border-radius:22px;padding:20px;border:1px solid rgba(148,163,184,.2);background:#0b1220;box-shadow:0 26px 60px rgba(0,0,0,.6)}
    #catCard h3{margin:0 0 4px;font-size:19px;font-weight:900;color:#e2e8f0}
    #catCard .sub{margin:0 0 14px;font-size:11.5px;color:#94a3b8;line-height:1.5}
    .catRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid rgba(148,163,184,.14)}
    .catRow span{font-size:13px;font-weight:600;color:#e2e8f0}
    .catRow small{display:block;font-size:10.5px;color:#94a3b8;font-weight:400;margin-top:2px}
    .catSeg{display:flex;gap:4px;flex-shrink:0}
    .catSeg button{border:1px solid rgba(148,163,184,.24);background:rgba(255,255,255,.05);color:#94a3b8;font:inherit;font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:9px;cursor:pointer}
    .catSeg button.sel{background:linear-gradient(100deg,#a3e635,#22d3ee);color:#07110a;border-color:transparent}
    #catClose{margin-top:16px;width:100%;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:14px;color:#07110a;padding:12px;border-radius:999px;background:linear-gradient(100deg,#a3e635,#22d3ee)}
  `;
  document.head.appendChild(css);

  const dock = document.createElement("div");
  dock.id = "catDock";
  dock.dataset.mood = "default";
  dock.innerHTML = "<div id=catFace><img id=catImgFull src=" + CAT_IMG_FULL + " alt=cat><img id=catImg src=" + CAT_IMG + " alt=cat>" + CAT_FACES + "</div><div id=catBubble></div>";
  document.body.appendChild(dock);
  const bubble = dock.querySelector("#catBubble");

  let bubbleTimer = null;
  let faceTimer = null;
  let lastSay = 0;
  let currentMessage = "";

  function formatMessage(text) {
    const lines = text.split("\n");
    if (assistantLanguage === "ko") return lines[0];
    if (assistantLanguage === "en") return lines[1] || lines[0];
    return text;
  }

  function say(text, mood, force) {
    if (!catOn) return;
    const now = performance.now();
    if (!force && now - lastSay < COOLDOWN[chatter]) return;
    lastSay = now;
    currentMessage = text;
    dock.dataset.mood = mood || "default";
    bubble.textContent = formatMessage(text);
    bubble.classList.add("on");
    dock.classList.add("pop");
    clearTimeout(bubbleTimer);
    clearTimeout(faceTimer);
    bubbleTimer = setTimeout(() => {
      bubble.classList.remove("on");
      dock.classList.remove("pop");
      faceTimer = setTimeout(() => { dock.dataset.mood = "default"; }, 250);
    }, chatter === "chatty" ? 3400 : 2600);
  }

  function injectSettingsButton() {
    if (!panel.isConnected || panel.querySelector("#catSetBtn")) return;
    if (panel.querySelector("[data-intro]") || panel.dataset.tutorial === "true") return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.id = "catSetBtn";
    btn.textContent = "🐱 고양이 도우미 / 설정";
    btn.addEventListener("click", openSettings);
    panel.appendChild(btn);
  }

  const modal = document.createElement("div");
  modal.id = "catModal";
  modal.hidden = true;
  modal.innerHTML =
    "<div id=catCard>" +
      "<h3>🐱 고양이 도우미 설정</h3>" +
      "<p class=sub>게임을 함께하고 중요한 순간에 알려드려요. 설정은 이 기기에 자동 저장됩니다.</p>" +
      "<div class=catRow><div><span>도우미</span><small>끄면 고양이가 나타나지 않습니다</small></div><div class=catSeg data-set=cat></div></div>" +
      "<div class=catRow><div><span>수다 정도</span><small>안내 메시지 빈도</small></div><div class=catSeg data-set=chatter></div></div>" +
      "<div class=catRow><div><span>언어 / Language</span><small>한국어, English 또는 둘 다</small></div><div class=catSeg data-set=language></div></div>" +
      "<div class=catRow><div><span>화면 방향 패드</span><small>화면 아래에 표시되는 조작 버튼</small></div><div class=catSeg data-set=dpad></div></div>" +
      "<div class=catRow><div><span>효과음</span><small>오른쪽 위 스피커 버튼과 연동됩니다</small></div><div class=catSeg data-set=sound></div></div>" +
      "<button type=button id=catClose>닫기</button>" +
    "</div>";
  document.body.appendChild(modal);

  const isMuted = () => (muteBtn ? muteBtn.textContent.trim() === "🔇" : false);

  function seg(host, items, current, onPick) {
    if (!host) return;
    host.innerHTML = "";
    items.forEach((it) => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = it[1];
      if (it[0] === current) b.classList.add("sel");
      b.addEventListener("click", () => { onPick(it[0]); renderSettings(); });
      host.appendChild(b);
    });
  }

  function applyCat() {
    if (!catOn) {
      clearTimeout(bubbleTimer);
      clearTimeout(faceTimer);
      bubble.classList.remove("on");
      dock.classList.remove("pop");
    }
    dock.style.display = catOn ? "" : "none";
  }

  function applyDpad() {
    if (dpad) dpad.style.display = dpadOn ? "" : "none";
  }

  function renderSettings() {
    seg(modal.querySelector("[data-set=cat]"), [["1", "켜기"], ["0", "끄기"]], catOn ? "1" : "0",
      (v) => { catOn = v === "1"; save(K_CAT, v); applyCat(); });
    seg(modal.querySelector("[data-set=chatter]"),
      [["quiet", "조용히"], ["normal", "보통"], ["chatty", "수다쟁이"]], chatter,
      (v) => { chatter = v; save(K_CHAT, v); });
    seg(modal.querySelector("[data-set=language]"),
      [["ko", "한국어"], ["en", "EN"], ["both", "둘 다"]], assistantLanguage,
      (v) => {
        assistantLanguage = v;
        save(K_LANG, v);
        if (bubble.classList.contains("on")) bubble.textContent = formatMessage(currentMessage);
      });
    seg(modal.querySelector("[data-set=dpad]"), [["1", "표시"], ["0", "숨김"]], dpadOn ? "1" : "0",
      (v) => { dpadOn = v === "1"; save(K_DPAD, v); applyDpad(); });
    seg(modal.querySelector("[data-set=sound]"), [["on", "켜기"], ["off", "끄기"]],
      isMuted() ? "off" : "on", () => { if (muteBtn) muteBtn.click(); });
  }

  function openSettings() { renderSettings(); modal.hidden = false; }
  function closeSettings() { modal.hidden = true; }

  modal.querySelector("#catClose").addEventListener("click", closeSettings);
  modal.addEventListener("pointerdown", (e) => { if (e.target === modal) closeSettings(); });
  window.addEventListener("keydown", (e) => {
    if (!modal.hidden && e.key === "Escape") { e.stopPropagation(); closeSettings(); }
  }, true);

  let lastScore = parseInt(scoreEl.textContent, 10) || 0;
  let lastLevel = parseInt(levelEl.textContent, 10) || 1;

  function onScore() {
    const s = parseInt(scoreEl.textContent, 10) || 0;
    if (s > lastScore) {
      const gain = s - lastScore;
      const c = parseInt(String(comboEl.textContent).replace("x", ""), 10) || 1;
      if (c >= 4) say(`연속 콤보 x${c}! 2.6초 안에 계속 먹으면 유지돼요.\nCombo x${c}! Keep eating within 2.6 seconds to keep it going.`, "love", true);
      else if (gain >= 30) say(`콤보 보너스 +${gain}점!\nCombo bonus: +${gain} points!`, "happy");
      if (lastScore < 80 && s >= 80) say("100점이 코앞이에요! 몬스터가 곧 나타나요.\nYou're close to 100! A monster is coming.", "shock", true);
      if (Math.floor(lastScore / 100) < Math.floor(s / 100)) say("몬스터가 또 나타났어요. 조심해서 움직여요!\nAnother monster appeared. Watch your moves!", "shock", true);
      if (s >= 300) say("점수가 높을수록 빨라져요. 크게 도는 게 안전해요.\nThe game gets faster as you score. Wide turns are safer.", "smug");
    }
    lastScore = s;
  }

  function onLevel() {
    const l = parseInt(levelEl.textContent, 10) || 1;
    if (l > lastLevel) say(`레벨 ${l}! 속도가 빨라져요. 침착하게!\nLevel ${l}! Things are getting faster. Stay calm!`, "smug", true);
    lastLevel = l;
  }

  function onOverlay() {
    if (overlay.hidden) return;
    const t = panel.textContent || "";
    if (panel.querySelector("[data-intro]")) {
      say("내 소개를 읽어줘서 고마워요! 준비되면 같이 놀아요.\nThanks for reading my intro! Let's play when you're ready.", "happy", true);
    } else if (t.indexOf("GAME OVER") >= 0) {
      if (t.indexOf("신기록") >= 0) say("신기록이에요! 정말 대단해요 🏆\nNew high score! You're amazing! 🏆", "love", true);
      else say("괜찮아요. 다시 해봐요! 몸에 부딪히지 않게 조심해요.\nThat's okay. Try again! Be careful not to run into yourself.", "sad", true);
    } else if (t.indexOf("PERFECT") >= 0) {
      say("맵을 전부 채웠어요! 전설적인 플레이예요!\nYou filled the whole board! Legendary play!", "love", true);
    } else if (t.indexOf("잠깐") >= 0) {
      say("잠깐 쉬어요. 여기서 기다릴게요.\nTake a break. I'll be right here.", "default", true);
    } else if (t.indexOf("NEON") >= 0) {
      say("PLAY를 눌러 시작해요. 방향키, WASD 또는 스와이프로 움직여요.\nPress PLAY to start. Use the arrow keys, WASD, or swipe to move.", "default", true);
    }
    injectSettingsButton();
  }

  new MutationObserver(() => { onScore(); onLevel(); })
    .observe(scoreEl, { childList: true, characterData: true, subtree: true });
  new MutationObserver(() => { onLevel(); })
    .observe(levelEl, { childList: true, characterData: true, subtree: true });
  new MutationObserver(onOverlay)
    .observe(overlay, { attributes: true, attributeFilter: ["hidden"] });
  new MutationObserver(injectSettingsButton)
    .observe(panel, { childList: true });

  setInterval(() => {
    if (!catOn || !overlay.hidden) return;
    const s = parseInt(scoreEl.textContent, 10) || 0;
    if (s === 0) say("먹이를 먹으면 점수를 얻어요. 벽에 부딪히면 게임이 끝나요.\nEat the food to score. Hitting a wall ends the game.", "default");
    else if (s < 100) say("계속 먹으면 콤보가 쌓여요. 최대 x5, 한 번에 50점!\nKeep eating to build combos. Up to x5 and 50 points each!", "happy");
    else say("가장자리를 따라가면 안전해요. 가운데는 방향을 바꿀 공간으로 남겨둬요.\nStay near the edge for safety. Leave the middle open for turns.", "smug");
  }, 12000);

  const POS_KEY = "neonSnake.catpos.v1";
  function enableDrag() {
    const faceBox = dock.querySelector("#catFace");
    if (!faceBox) return;
    let dragging = false;
    let ox = 0;
    let oy = 0;
    const savedPos = load(POS_KEY, "");
    if (savedPos) {
      const pp = savedPos.split(",");
      if (pp.length === 2) {
        dock.style.right = "auto";
        dock.style.bottom = "auto";
        dock.style.left = pp[0] + "px";
        dock.style.top = pp[1] + "px";
      }
    }
    faceBox.addEventListener("pointerdown", (e) => {
      dragging = true;
      dock.classList.add("drag");
      const r = dock.getBoundingClientRect();
      dock.style.right = "auto";
      dock.style.bottom = "auto";
      dock.style.left = r.left + "px";
      dock.style.top = r.top + "px";
      ox = e.clientX - r.left;
      oy = e.clientY - r.top;
      faceBox.setPointerCapture(e.pointerId);
      say("앗! 잡아당기지 마요!\nHey! Don't tug on me!", "shock", true);
      e.preventDefault();
    });
    faceBox.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      let x = e.clientX - ox;
      let y = e.clientY - oy;
      x = Math.max(4, Math.min(window.innerWidth - 64, x));
      y = Math.max(4, Math.min(window.innerHeight - 56, y));
      dock.style.left = x + "px";
      dock.style.top = y + "px";
    });
    const endDrag = () => {
      if (!dragging) return;
      dragging = false;
      dock.classList.remove("drag");
      save(POS_KEY, Math.round(parseFloat(dock.style.left)) + "," + Math.round(parseFloat(dock.style.top)));
      say("휴……살살 내려놔 줘요.\nPhew... Put me down gently.", "smug", true);
    };
    faceBox.addEventListener("pointerup", endDrag);
    faceBox.addEventListener("pointercancel", endDrag);
  }
  applyCat();
  applyDpad();
  enableDrag();
  onOverlay();
  injectSettingsButton();
})();
</script>
<script>
(() => {
  "use strict";

  const slides = [
    {
      label: "PROJECT INTRODUCTION",
      title: "NEON SNAKE",
      subtitle: "설치 없이 바로 즐기는 네온 스네이크",
      groups: [
        { title: "EAT · GROW · GLOW", text: "먹고, 성장하고, 빛나는 한 판을 시작해 보세요." },
        { title: "게임 소개", text: "네온 먹이를 먹고 콤보와 점수를 쌓아, 점점 빨라지는 도전에서 최고 기록에 도전하세요." },
        { title: "단일 파일 웹 게임", text: "HTML, CSS, JavaScript를 한 페이지에 담았습니다." },
        { title: "설치 없이 플레이", text: "index.html을 브라우저에서 열면 바로 시작할 수 있습니다." },
        { title: "모바일 조작 지원", text: "키보드와 터치 조작을 모두 지원합니다." },
        { title: "ARCADE MODE · SCORE 120", text: "클릭할 때마다 뱀의 몸통이 파도처럼 한 칸씩 움직이는 표지도 확인해 보세요. 🟢 🟢 🟢 🟢 🟢 🟢" }
      ]
    },
    {
      label: "01 / 플레이 경험",
      title: "쉬운 규칙, 점점 높아지는 도전",
      subtitle: "규칙은 간단하고 난이도는 점차 올라갑니다. 키보드와 터치 조작을 모두 지원합니다.",
      groups: [
        { title: "01 · 고양이 도우미", text: "게임의 중요한 순간에 함께 반응하는 고양이 친구를 소개합니다." },
        { title: "플레이에 반응", text: "먹이·콤보·레벨업 등 중요한 순간에 표정과 대사로 반응합니다." },
        { title: "실시간 도움과 설정", text: "몬스터를 미리 알려주고, 언어·수다 정도·고양이 위치도 설정할 수 있어요." },
        { title: "02 · 몸에 닿아도 계속 플레이", text: "자기 몸에 부딪혀도 바로 게임 오버가 되지 않습니다." },
        { title: "충돌 페널티", text: "몸이 한 칸 줄어요. 몸이 남아 있으면 계속 플레이할 수 있어요." },
        { title: "게임 오버 조건", text: "벽에 닿거나 몸이 너무 짧으면 게임이 끝납니다." },
        { title: "03 · 100점부터 몬스터 등장", text: "점수가 100점에 도달하면 첫 몬스터가 나타납니다." },
        { title: "첫 등장", text: "👾 100점부터 출현" },
        { title: "추가 등장", text: "점수가 100점 더 오를 때마다 몬스터가 한 마리씩 추가됩니다." },
        { title: "최대 3마리", text: "몬스터는 최대 3마리까지 늘어나며 보드 안을 움직입니다." },
        { title: "먹이와 콤보", text: "먹이를 먹어 성장하고, 2.6초 안에 연속으로 먹으면 콤보가 최대 x5까지 올라갑니다." },
        { title: "조작", text: "방향키 / WASD / 모바일 스와이프 · 최고 기록은 브라우저에 저장됩니다." },
        { title: "플레이 편의 기능", text: "일시정지, 효과음, 진동을 지원합니다." }
      ]
    },
    {
      label: "02 / 게임을 위해 설계",
      title: "작지만 완성도 높은 경험",
      subtitle: "설치나 빌드 과정 없이 브라우저에서 실행됩니다. 핵심 플레이와 편의 기능을 한 페이지에 담았습니다.",
      groups: [
        { title: "01 · 단일 파일로 제공", text: "HTML / CSS / JavaScript를 index.html 하나에 통합" },
        { title: "02 · Canvas 기반 게임 화면", text: "네온 뱀·격자·먹이·몬스터·파티클 효과" },
        { title: "03 · 브라우저 기본 기능 활용", text: "WebAudio 효과음 + localStorage에 최고 기록과 설정 저장" },
        { title: "🐱 플레이에 반응하는 고양이 도우미", text: "먹이·콤보·레벨업·몬스터·신기록 순간에 표정으로 반응합니다." },
        { title: "실시간 공략 팁", text: "80점 전후 몬스터를 예고하고, 100점마다 추가 알림과 상황별 팁을 제공합니다." },
        { title: "취향에 맞게 설정", text: "한국어·영어·이중 언어, 말수와 도우미 켜기/끄기를 설정하고 고양이 위치도 드래그할 수 있습니다." },
        { title: "모바일 지원 · 감사합니다", text: "스와이프 · 방향 패드 · 진동 피드백\nindex.html을 열어 바로 시작하세요!" }
      ]
    }
  ];

  const openButton = document.getElementById("projectPptButton");
  const viewer = document.getElementById("pptViewer");
  const content = document.getElementById("pptContent");
  const progress = document.getElementById("pptProgress");
  const prevButton = document.getElementById("pptPrevButton");
  const nextButton = document.getElementById("pptNextButton");
  const closeButton = document.getElementById("pptCloseButton");
  if (!openButton || !viewer || !content || !progress || !prevButton || !nextButton || !closeButton) return;

  let slideIndex = 0;
  let revealed = 0;
  let previousFocus = null;

  function render() {
    const slide = slides[slideIndex];
    const visibleGroups = slide.groups.slice(0, revealed);
    content.innerHTML =
      `<p class="ppt-slide-label">${slide.label}</p>` +
      `<h2>${slide.title}</h2>` +
      `<p class="ppt-subtitle">${slide.subtitle}</p>` +
      `<div class="ppt-reveals">${visibleGroups.map(group =>
        `<article class="ppt-item"><strong>${group.title}</strong><p>${group.text}</p></article>`
      ).join("")}</div>`;

    progress.textContent = `슬라이드 ${slideIndex + 1} / ${slides.length} · 클릭 공개 ${revealed} / ${slide.groups.length}`;
    prevButton.disabled = slideIndex === 0 && revealed === 0;
    nextButton.textContent = revealed < slide.groups.length
      ? "다음 내용 ▶"
      : (slideIndex < slides.length - 1 ? "다음 슬라이드 ▶" : "소개 끝내기");
  }

  function openViewer() {
    previousFocus = document.activeElement;
    slideIndex = 0;
    revealed = 0;
    render();
    viewer.hidden = false;
    closeButton.focus();
  }

  function closeViewer() {
    viewer.hidden = true;
    if (previousFocus && typeof previousFocus.focus === "function") previousFocus.focus();
  }

  function next() {
    const slide = slides[slideIndex];
    if (revealed < slide.groups.length) {
      revealed++;
    } else if (slideIndex < slides.length - 1) {
      slideIndex++;
      revealed = 0;
    } else {
      closeViewer();
      return;
    }
    render();
    content.scrollTop = content.scrollHeight;
  }

  function previous() {
    if (revealed > 0) {
      revealed--;
    } else if (slideIndex > 0) {
      slideIndex--;
      revealed = slides[slideIndex].groups.length;
    }
    render();
    content.scrollTop = 0;
  }

  openButton.addEventListener("click", openViewer);
  closeButton.addEventListener("click", closeViewer);
  nextButton.addEventListener("click", next);
  prevButton.addEventListener("click", previous);
  viewer.addEventListener("pointerdown", (event) => {
    if (event.target === viewer) closeViewer();
  });
  viewer.addEventListener("keydown", (event) => {
    event.stopPropagation();
    if (event.key === "Escape") {
      event.preventDefault();
      closeViewer();
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      next();
    } else if (event.key === "ArrowLeft") {
      event.preventDefault();
      previous();
    }
  });
})();
</script>
</body>
</html>
